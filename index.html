const KEY = 'shop_system_v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('en-US');
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => String(s ?? '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[ً-ْ]/g, '');
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const TYPES = ['إيجار', 'كهرباء', 'مواصلات', 'أكياس وتغليف', 'مرتبات', 'أخرى'];

let db, storageOK = true;
const fresh = () => ({ v: 1, shop: 'نظام إدارة المحل', low: 0, items: SEED.map(i => ({ ...i })), sales: [], purchases: [], expenses: [], lastBackup: '' });
function load() {
  try { const r = localStorage.getItem(KEY); if (r) { db = JSON.parse(r); return; } } catch (e) { storageOK = false; }
  db = fresh();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { storageOK = false; }
  refreshHeader();
}
load();

/* ---------- derived data ---------- */
function stockMap() {
  const m = {};
  db.items.forEach(i => m[i.code] = +i.open || 0);
  db.purchases.forEach(p => { if (p.code in m) m[p.code] += +p.qty; });
  db.sales.forEach(s => { if (s.code in m) m[s.code] -= +s.qty; });
  return m;
}
const itemBy = code => db.items.find(i => i.code === code);
const status = st => st <= 0 ? 'out' : st <= db.low ? 'low' : 'ok';
const statusTxt = { out: 'نفد', low: 'يحتاج شراء', ok: 'متوفر' };
const pillFor = st => `<span class="pill ${status(st)}">${statusTxt[status(st)]}</span>`;
const itemLabel = i => i ? `${i.name}${i.model ? ' - ' + i.model.trim() : ''}${i.size ? ' - ' + i.size : ''}` : '';
const nameOf = code => { const i = itemBy(code); return i ? itemLabel(i) : code + ' (محذوف)'; };
const saleTotal = s => (+s.qty) * (+s.price);

function refreshHeader() {
  $('#shopname').textContent = db.shop;
  document.title = db.shop;
  const t = today(), sm = stockMap();
  const ts = db.sales.filter(s => s.date === t);
  const sales = ts.reduce((a, s) => a + saleTotal(s), 0);
  const profit = ts.reduce((a, s) => a + (s.price - s.cost) * s.qty, 0);
  const need = db.items.filter(i => status(sm[i.code]) !== 'ok').length;
  $('#kpis').innerHTML = `
    <div class="kpi"><small>مبيعات اليوم</small><b>${fmt(sales)} ج</b></div>
    <div class="kpi"><small>ربح اليوم</small><b class="${profit >= 0 ? 'pos' : 'neg'}">${fmt(profit)} ج</b></div>
    <div class="kpi"><small>أصناف تحتاج شراء</small><b>${need}</b></div>`;
}

function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function armed(b, label) {
  if (b.dataset.armed) return true;
  b.dataset.armed = '1'; b.dataset.old = b.textContent; b.textContent = label || 'اضغط للتأكيد';
  setTimeout(() => { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.textContent = b.dataset.old; } }, 3000);
  return false;
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg || 'تم النسخ'); return true; }
  catch (e) { return false; }
}

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button class="tab" role="tab" data-act="tab" data-k="${k}" aria-selected="${k === tab}">${n}</button>`).join('');

}

function renderCart() {

  const sum = cart.reduce((a, l) => a + l.qty * l.price, 0);

/* ---------- REPORTS ---------- */
let repPeriod = 'month', repFrom = '', repTo = '';
function range() {
  const now = new Date(), t = iso(now);
  if (repPeriod === 'today') return [t, t];
  if (repPeriod === 'week') { const d = new Date(now); d.setDate(d.getDate() - 6); return [iso(d), t]; }
  if (repPeriod === 'month') return [t.slice(0, 7) + '-01', t];
  if (repPeriod === 'last') { const a = new Date(now.getFullYear(), now.getMonth() - 1, 1), b = new Date(now.getFullYear(), now.getMonth(), 0); return [iso(a), iso(b)]; }
  if (repPeriod === 'custom') return [repFrom || '0000-00-00', repTo || '9999-99-99'];
  return ['0000-00-00', '9999-99-99'];
}
function viewReports() {
  const opts = [['today', 'النهارده'], ['week', 'آخر 7 أيام'], ['month', 'الشهر ده'], ['last', 'الشهر اللي فات'], ['all', 'كل الفترة'], ['custom', 'فترة محددة']];
  main.innerHTML = `
  <section class="panel"><div class="row">
    <div class="field"><label for="rp">الفترة</label><select id="rp">${opts.map(([k, n]) => `<option value="${k}" ${k === repPeriod ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field" ${repPeriod === 'custom' ? '' : 'hidden'} id="rfw"><label for="rf">من</label><input id="rf" type="date" value="${repFrom}"></div>
    <div class="field" ${repPeriod === 'custom' ? '' : 'hidden'} id="rtw"><label for="rt">إلى</label><input id="rt" type="date" value="${repTo}"></div>
  </div></section>
  <div id="repbody" style="display:flex;flex-direction:column;gap:16px"></div>`;
  $('#rp').addEventListener('change', e => { repPeriod = e.target.value; viewReports(); });
  if (repPeriod === 'custom') {
    $('#rf').addEventListener('change', e => { repFrom = e.target.value; renderReport(); });
    $('#rt').addEventListener('change', e => { repTo = e.target.value; renderReport(); });
  }
  renderReport();
}
function renderReport() {
  const [a, b] = range();
  const S = db.sales.filter(s => s.date >= a && s.date <= b);
  const E = db.expenses.filter(e => e.date >= a && e.date <= b);
  const sales = S.reduce((x, s) => x + saleTotal(s), 0);
  const cogs = S.reduce((x, s) => x + s.qty * s.cost, 0);
  const exp = E.reduce((x, e) => x + +e.amount, 0);
  const gross = sales - cogs, net = gross - exp;
  const invs = new Set(S.map(s => s.inv)).size, pieces = S.reduce((x, s) => x + +s.qty, 0);

  const group = (keyFn, valFn) => { const m = {}; S.forEach(s => { const k = keyFn(s); m[k] = (m[k] || 0) + valFn(s); }); return Object.entries(m).sort((x, y) => y[1] - x[1]); };
  const top = group(s => s.code, s => +s.qty).slice(0, 8);
  const cats = group(s => itemBy(s.code)?.cat || 'غير محدد', saleTotal);
  const maxTop = top[0]?.[1] || 1, maxCat = cats[0]?.[1] || 1;

  /* time series: days when the range is short, months otherwise */
  const dates = S.map(s => s.date).sort();
  let lo = a === '0000-00-00' ? (dates[0] || today()) : a, hi = b === '9999-99-99' ? (dates[dates.length - 1] || today()) : b;
  const span = (new Date(hi) - new Date(lo)) / 864e5 + 1;
  const monthly = span > 62;
  const series = [];
  if (monthly) {
    let y = +lo.slice(0, 4), m = +lo.slice(5, 7);
    while (y + '-' + pad(m) <= hi.slice(0, 7) && series.length < 60) { series.push([y + '-' + pad(m), 0]); m++; if (m > 12) { m = 1; y++; } }
  } else {
    for (let d = new Date(lo); iso(d) <= hi && series.length < 70; d.setDate(d.getDate() + 1)) series.push([iso(d), 0]);
  }
  const idx = {}; series.forEach((x, n) => idx[x[0]] = n);
  S.forEach(s => { const k = monthly ? s.date.slice(0, 7) : s.date; if (k in idx) series[idx[k]][1] += saleTotal(s); });
  const maxV = Math.max(...series.map(x => x[1]), 1);
  const peak = series.reduce((p, x, n) => x[1] > series[p][1] ? n : p, 0);

  $('#repbody').innerHTML = `
  <div class="cards">
    <div class="card"><small>المبيعات</small><b>${fmt(sales)} ج</b></div>
    <div class="card"><small>تكلفة البضاعة المباعة</small><b>${fmt(cogs)} ج</b></div>
    <div class="card"><small>مجمل الربح</small><b class="${gross >= 0 ? 'pos' : 'neg'}">${fmt(gross)} ج</b></div>
    <div class="card"><small>المصروفات</small><b>${fmt(exp)} ج</b></div>
    <div class="card hl"><small>صافي الربح</small><b class="${net >= 0 ? 'pos' : 'neg'}">${fmt(net)} ج</b></div>
    <div class="card"><small>عدد الفواتير / القطع</small><b>${invs} / ${fmt(pieces)}</b></div>
  </div>
  <section class="panel"><h2>${monthly ? 'المبيعات بالشهر' : 'المبيعات باليوم'}</h2>
    ${sales ? `<div class="bars" dir="ltr">${series.map(([k, v], n) => `<div class="bar ${n === peak && v ? 'peak' : ''}" data-v="${fmt(v)}" title="${k}: ${fmt(v)} ج" style="height:${Math.max(1, v / maxV * 100)}%"></div>`).join('')}</div>
    <div class="axis" dir="ltr">${series.map(([k]) => `<span>${monthly ? k.slice(5) : k.slice(8)}</span>`).join('')}</div>` : '<div class="empty">مفيش مبيعات في الفترة دي.</div>'}</section>
  <div class="grid2" style="grid-template-columns:1fr 1fr">
    <section class="panel"><h2>أكتر الأصناف مبيعًا (بالعدد)</h2>${top.length ? top.map(([c, v]) => `<div class="hbar"><span>${esc(nameOf(c))}<br><small class="muted">${esc(c)}</small></span><i style="width:${v / maxTop * 100}%"></i><b>${v}</b></div>`).join('') : '<div class="empty">لا توجد بيانات.</div>'}</section>
    <section class="panel"><h2>المبيعات حسب التصنيف</h2>${cats.length ? cats.map(([c, v]) => `<div class="hbar"><span>${esc(c)}</span><i style="width:${v / maxCat * 100}%"></i><b>${fmt(v)}</b></div>`).join('') : '<div class="empty">لا توجد بيانات.</div>'}</section>
  </div>`;
}

  const last = db.lastBackup ? `آخر نسخة احتياطية: ${db.lastBackup}` : 'لسه ماعملتش نسخة احتياطية.';
  main.innerHTML = `
  ${storageOK ? '' : '<div class="notice">المتصفح مش سامح بحفظ البيانات في الوضع ده. البيانات هتفضل شغالة لحد ما تقفل الصفحة، فخد نسخة احتياطية قبل ما تخرج.</div>'}
  <section class="panel"><h2>إعدادات</h2><div class="row">
    <div class="field" style="flex:2 1 200px"><label for="sname">اسم المحل</label><input id="sname" value="${esc(db.shop)}"></div>
    <div class="field" style="flex:0 1 200px"><label for="slow">يعتبر "يحتاج شراء" لما الرصيد ≤</label><input id="slow" type="number" min="0" value="${db.low}"></div>
    <button class="btn primary" data-act="savesettings">حفظ</button></div></section>
  <section class="panel"><h2>نسخة احتياطية</h2>
    <p class="muted" style="margin:0 0 8px">البيانات محفوظة في المتصفح على الجهاز ده فقط. خد نسخة احتياطية بشكل دوري، وخصوصًا قبل مسح بيانات المتصفح أو تغيير الموبايل. ${last}</p>
    <div class="actions"><button class="btn primary" data-act="copybackup">نسخ بيانات النظام</button></div>
    <p class="hint">الصق النص اللي اتنسخ في ملاحظات أو رسالة على واتساب لنفسك. وعشان تسترجع، الصق النص في الخانة اللي تحت.</p>
    <h3>استرجاع نسخة</h3>
    <textarea id="restoretxt" placeholder="الصق بيانات النسخة الاحتياطية هنا"></textarea>
    <div class="actions"><input type="file" id="restorefile" accept=".json,application/json" style="max-width:260px"><button class="btn" data-act="restore">استرجاع</button></div>
  </section>
  <section class="panel"><h2>نسخ للصقها في إكسيل</h2><div class="actions">
    <button class="btn" data-act="tsv" data-k="sales">المبيعات</button><button class="btn" data-act="tsv" data-k="purchases">المشتريات</button>
    <button class="btn" data-act="tsv" data-k="expenses">المصروفات</button><button class="btn" data-act="tsv" data-k="stock">المخزون</button></div>
    <textarea id="tsvout" readonly hidden style="margin-top:10px"></textarea></section>
  <section class="panel"><h2>مسح كل شيء</h2><p class="muted" style="margin:0 0 8px">يرجّع النظام لبيانات ملف الإكسيل الأصلي ويمسح كل المبيعات والمشتريات والمصروفات.</p>
    <button class="btn danger" data-act="reset">مسح كل المبيعات والمشتريات والرجوع للبداية</button></section>`;
  $('#restorefile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $('#restoretxt').value = r.result; }; r.readAsText(f);
  });
}
function tsv(k) {
  const rows = [];
  if (k === 'sales') { rows.push(['التاريخ', 'فاتورة', 'الكود', 'الصنف', 'الكمية', 'سعر البيع', 'الإجمالي', 'سعر الشراء']); db.sales.forEach(s => rows.push([s.date, s.inv, s.code, nameOf(s.code), s.qty, s.price, saleTotal(s), s.cost])); }
  if (k === 'purchases') { rows.push(['التاريخ', 'الكود', 'الصنف', 'الكمية', 'سعر الشراء']); db.purchases.forEach(p => rows.push([p.date, p.code, nameOf(p.code), p.qty, p.cost])); }
  if (k === 'expenses') { rows.push(['التاريخ', 'النوع', 'المبلغ', 'ملاحظة']); db.expenses.forEach(e => rows.push([e.date, e.type, e.amount, e.note || ''])); }
  if (k === 'stock') { const sm = stockMap(); rows.push(['الكود', 'التصنيف', 'الصنف', 'سعر الشراء', 'سعر البيع', 'الرصيد', 'الحالة']); db.items.forEach(i => rows.push([i.code, i.cat, itemLabel(i), i.buy, i.sell, sm[i.code], statusTxt[status(sm[i.code])]])); }
  return rows.map(r => r.map(c => String(c).replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
}

/* ---------- actions ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'closemodal') { if (e.target === b) $('#layer').innerHTML = ''; return; }
  if (act === 'tab') return go(b.dataset.k);
  if (act === 'salecat') { saleCat = b.dataset.c; document.querySelectorAll('#cats .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.c === saleCat)); return renderResults(); }
  if (act === 'add') {
    const code = b.dataset.code, l = cart.find(x => x.code === code);
    if (l) l.qty++; else cart.push({ code, qty: 1, price: itemBy(code).sell });
    return renderCart();
  }
  if (act === 'qty') { const l = cart[+b.dataset.n]; l.qty = Math.max(1, l.qty + +b.dataset.d); return renderCart(); }
  if (act === 'rmline') { cart.splice(+b.dataset.n, 1); return renderCart(); }
  if (act === 'clearcart') { cart = []; return renderCart(); }
  if (act === 'sell') {
    if (!cart.length) return toast('الفاتورة فاضية');
    const date = $('#sdate').value || today(), inv = uid();
    cart.forEach(l => db.sales.push({ id: uid(), inv, date, code: l.code, qty: l.qty, price: +l.price || 0, cost: itemBy(l.code).buy }));
    const sum = cart.reduce((a, l) => a + l.qty * l.price, 0);
    cart = []; save(); toast('تم تسجيل البيع: ' + fmt(sum) + ' ج');
    renderCart(); renderResults(); renderRecentSales(); return;
  }
  if (act === 'delsale') { if (!armed(b)) return; db.sales = db.sales.filter(s => s.inv !== b.dataset.inv); save(); toast('اتحذفت الفاتورة والرصيد رجع'); renderRecentSales(); return renderResults(); }
  if (act === 'buy') {
    const i = itemBy($('#pitem').value.split(' — ')[0].trim());
    const qty = +$('#pqty').value, cost = +$('#pcost').value;
    if (!i) return toast('اختار الصنف من القائمة');
    if (!(qty > 0)) return toast('اكتب الكمية');
    db.purchases.push({ id: uid(), date: $('#pdate').value || today(), code: i.code, qty, cost: cost || i.buy });
    if ($('#pupd').checked && cost > 0) i.buy = cost;
    save(); toast('تم تسجيل الشراء: ' + itemLabel(i));
    $('#pitem').value = ''; $('#pqty').value = 1; $('#pcost').value = ''; return renderRecentPurchases();
  }
  if (act === 'delbuy') { if (!armed(b)) return; db.purchases = db.purchases.filter(p => p.id !== b.dataset.id); save(); return renderRecentPurchases(); }
  if (act === 'newitem') return itemForm(null);
  if (act === 'edititem') return itemForm(itemBy(b.dataset.code));
  if (act === 'saveitem') {
    const v = id => $('#f_' + id).value.trim();
    const isNew = b.dataset.new === '1';
    const it = { code: v('code'), cat: v('cat'), name: v('name'), model: v('model'), size: v('size'), color: v('color'), unit: 'قطعة', buy: +v('buy') || 0, sell: +v('sell') || 0, open: +v('open') || 0 };
    if (!it.code || !it.name) return toast('الكود والاسم مطلوبين');
    if (isNew) { if (itemBy(it.code)) return toast('الكود ده موجود قبل كده'); db.items.push(it); }
    else Object.assign(itemBy(it.code), it);
    save(); $('#layer').innerHTML = ''; toast('تم الحفظ'); return renderStockRows();
  }
  if (act === 'delitem') {
    const c = b.dataset.code;
    if (db.sales.some(s => s.code === c) || db.purchases.some(p => p.code === c)) return toast('الصنف عليه حركة بيع أو شراء، مينفعش يتحذف');
    if (!armed(b)) return;
    db.items = db.items.filter(i => i.code !== c); save(); $('#layer').innerHTML = ''; return renderStockRows();
  }
  if (act === 'addexp') {
    const amount = +$('#eamt').value; if (!(amount > 0)) return toast('اكتب المبلغ');
    const date = $('#edate').value || today();
    db.expenses.push({ id: uid(), date, type: $('#etype').value, amount, note: $('#enote').value.trim() });
    expMonth = date.slice(0, 7); $('#emonth').value = expMonth;
    save(); $('#eamt').value = ''; $('#enote').value = ''; toast('تم تسجيل المصروف'); return renderExpenses();
  }
  if (act === 'delexp') { if (!armed(b)) return; db.expenses = db.expenses.filter(x => x.id !== b.dataset.id); save(); return renderExpenses(); }
  if (act === 'savesettings') { db.shop = $('#sname').value.trim() || db.shop; db.low = Math.max(0, +$('#slow').value || 0); save(); return toast('تم الحفظ'); }
  if (act === 'copybackup') {
    const txt = JSON.stringify(db);
    db.lastBackup = today(); save();
    if (await copyText(txt, 'تم نسخ بيانات النظام')) return viewSettings();
    $('#restoretxt').value = txt; $('#restoretxt').select(); return toast('انسخ النص من الخانة اللي تحت');
  }
  if (act === 'restore') {
    const t = $('#restoretxt').value.trim(); if (!t) return toast('الصق النسخة الأول');
    let d; try { d = JSON.parse(t); } catch (err) { return toast('النص مش نسخة صحيحة'); }
    if (!d || !Array.isArray(d.items) || !Array.isArray(d.sales)) return toast('النص مش نسخة صحيحة');
    if (!armed(b, 'هتستبدل البيانات الحالية، اضغط للتأكيد')) return;
    db = Object.assign(fresh(), d); save(); toast('تم الاسترجاع'); return go('settings');
  }
  if (act === 'tsv') {
    const txt = tsv(b.dataset.k);
    if (await copyText(txt, 'تم النسخ، الصقه في إكسيل')) return;
    const o = $('#tsvout'); o.hidden = false; o.value = txt; o.select(); return toast('انسخ النص من الخانة');
  }
  if (act === 'reset') {
    if (!armed(b, 'متأكد؟ اضغط تاني')) return;
    db = fresh(); cart = []; save(); toast('رجع النظام للبداية'); return go('sales');
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actInput === 'price') { cart[+t.dataset.n].price = +t.value || 0; renderCart(); }
});

renderTabs(); refreshHeader(); go('sales');
</script>

</body></html>
